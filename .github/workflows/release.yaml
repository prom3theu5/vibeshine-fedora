name: Release

# For each project in projects/ (Vibeshine, Vibepollo): builds a new upstream
# stable tag into signed Fedora RPMs and publishes it as a GitHub release
# tagged <project>-<version>-<release>. Then regenerates the dnf repository on
# GitHub Pages. Days without a new upstream release only run the check.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      project:
        description: "Project to build (default: all)"
        required: false
        default: all
        type: choice
        options: [all, vibeshine, vibepollo]
      ref:
        description: "Upstream tag to build (default: latest stable; needs a single project)"
        required: false
        type: string
      package_release:
        description: RPM release number (bump to rebuild the same upstream tag)
        required: false
        default: "1"
        type: string
      repo_only:
        description: Only regenerate the dnf repository from existing releases
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FEDORA_VERSION: "44"
  # Releases per project indexed by the dnf repository (packages are served
  # from GitHub Releases; Pages hosts only the signed metadata).
  REPO_KEEP: "3"

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.vars.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Find releases to build
        id: vars
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PROJECT: ${{ inputs.project || 'all' }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_RELEASE: ${{ inputs.package_release || '1' }}
          REPO_ONLY: ${{ inputs.repo_only || false }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ $INPUT_RELEASE =~ ^[0-9]+$ ]] || { echo "bad release: $INPUT_RELEASE" >&2; exit 1; }
          if [[ -n $INPUT_REF && $INPUT_PROJECT == all ]]; then
            echo "ref needs a single project" >&2; exit 1
          fi
          entries=()
          for dir in projects/*/; do
            project=$(basename "$dir")
            [[ $INPUT_PROJECT == all || $INPUT_PROJECT == "$project" ]] || continue
            upstream=$(cat "$dir/upstream")
            ref=${INPUT_REF:-$(bash scripts/latest.sh "$upstream")}
            [[ $ref =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad ref for $project: $ref" >&2; exit 1; }
            tag="${project}-${ref#v}-${INPUT_RELEASE}"
            if [[ $REPO_ONLY == true ]]; then
              echo "- $project: repo_only set, skipping" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # Scheduled runs build an upstream version once: any release of it
            # (<project>-<version>-<n>) counts, so deleting a broken -1 after a
            # -2 never rebuilds it. Manual runs build exactly the requested tag.
            if [[ $EVENT == schedule ]]; then
              existing=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
                | awk -v p="${project}-${ref#v}-" 'index($0, p) == 1 { print; exit }')
            else
              existing=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            fi
            if [[ -n $existing ]]; then
              echo "- $project: $existing already released, skipping" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "- $project: building $tag from $upstream $ref" >> "$GITHUB_STEP_SUMMARY"
            entries+=("$(jq -cn --arg project "$project" --arg upstream "$upstream" \
              --arg ref "$ref" --arg tag "$tag" --arg release "$INPUT_RELEASE" \
              '{project: $project, upstream: $upstream, ref: $ref, tag: $tag, release: $release}')")
          done
          if (( ${#entries[@]} )); then
            matrix=$(printf '%s\n' "${entries[@]}" | jq -cs .)
          else
            matrix='[]'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target.tag }}
    needs: check
    if: needs.check.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      # The toolchain image (CUDA) and the build tree need more than the
      # runner's default free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build
        env:
          PROJECT: ${{ matrix.target.project }}
          UPSTREAM: ${{ matrix.target.upstream }}
          REF: ${{ matrix.target.ref }}
          RELEASE: ${{ matrix.target.release }}
        run: |
          docker buildx build -f Containerfile \
            --build-arg FEDORA_VERSION="$FEDORA_VERSION" \
            --build-arg PROJECT="$PROJECT" \
            --build-arg UPSTREAM="$UPSTREAM" \
            --build-arg REF="$REF" \
            --build-arg PACKAGE_RELEASE="$RELEASE" \
            --output type=local,dest=dist .
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.target.project }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release ${{ matrix.target.tag }}
    needs: [check, build]
    # Release each project whose build succeeded, even if another failed.
    if: always() && needs.check.result == 'success' && needs.check.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    container: docker.io/library/fedora:44
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.check.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        id: download
        continue-on-error: true
        with:
          name: rpms-${{ matrix.target.project }}
          path: dist

      - name: Stop if the build failed
        if: steps.download.outcome != 'success'
        env:
          TAG: ${{ matrix.target.tag }}
        run: |
          echo "No packages for $TAG: its build failed." >&2
          exit 1

      - name: Install tools
        run: dnf -y -q install rpm-sign gnupg2 gh

      - name: Sign packages
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: bash scripts/sign-rpms.sh dist

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.rpm

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ matrix.target.upstream }}
          REF: ${{ matrix.target.ref }}
          TAG: ${{ matrix.target.tag }}
          RELEASE: ${{ matrix.target.release }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          name=${UPSTREAM#*/}
          notes="Fedora ${FEDORA_VERSION} build of upstream ${name} [\`${REF}\`](https://github.com/${UPSTREAM}/releases/tag/${REF}).
          The source RPM contains the exact upstream source these packages were built from."
          gh release create "$TAG" dist/*.rpm dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "${name} ${REF} (Fedora, release ${RELEASE})" --notes "$notes"

  repo:
    name: Build dnf repository
    needs: [check, release]
    # After a run that released something, or on its own when repo_only is set.
    # A matrix job's result is success only if every leg succeeded, so a run
    # where one project failed still publishes when the other released.
    if: always() && needs.check.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'failure' || inputs.repo_only)
    runs-on: ubuntu-24.04
    container: docker.io/library/fedora:44
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: dnf -y -q install createrepo_c gnupg2 gh

      - name: Assemble repository
        env:
          GH_TOKEN: ${{ github.token }}
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
        run: bash scripts/build-repo.sh site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: repo
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
