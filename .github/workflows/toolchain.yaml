name: Toolchain

# Builds and pushes the RPM build toolchain image. Rebuilt when its definition
# changes, and weekly so it picks up Fedora updates and new build dependencies.

on:
  push:
    branches: [main]
    paths:
      - toolchain/**
      - projects/*/extra-buildrequires.txt
      - .github/workflows/toolchain.yaml
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolchain
  cancel-in-progress: false

env:
  FEDORA_VERSION: "44"
  IMAGE: ghcr.io/${{ github.repository_owner }}/vibeshine-fedora-toolchain

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags
        id: tags
        run: |
          image=${IMAGE,,}
          {
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:f${FEDORA_VERSION}"
            echo "$image:f${FEDORA_VERSION}-$(date -u +%Y%m%d)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: toolchain/Containerfile
          build-args: FEDORA_VERSION=${{ env.FEDORA_VERSION }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          provenance: mode=max

      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
